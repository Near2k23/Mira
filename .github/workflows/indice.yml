name: Índice verificado

# Solo a mano: el catálogo lo regenera quien sube (ver README). En automático fallaba en cada
# push mientras Actions no corre en esta cuenta.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indice
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar índice
        run: node scripts/indice/validar.mjs

      # Sin la clave de TMDB el catálogo saldría sin pósters ni años: mejor que falle y avise.
      - name: Exigir la clave de TMDB
        run: test -n "$TMDB_API_KEY" || { echo "Falta el secret TMDB_API_KEY"; exit 1; }
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Generar catálogo
        run: node scripts/indice/generar-catalogo.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Publicar catálogo si cambió
        run: |
          if [ -n "$(git status --porcelain -- indice/catalogo.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add indice/catalogo.json
            git commit -m "Índice: catálogo regenerado"
            git push
          fi
